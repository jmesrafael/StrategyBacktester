<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200"><rect width="480" height="200" fill="white"/><text x="0" y="14.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">CANCEL the limit order (do not enter late) if ANY of these happens first:</text><rect x="4" y="28" width="230" height="76" rx="8" fill="#faf5ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1"/><circle cx="24" cy="50" r="11" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="24" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">1</text><text x="42" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#7c3aed" text-anchor="start">Not filled within 8 candles</text><text x="18" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">about 2 hours after the gap formed.</text><text x="18" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">The pullback never came.</text><rect x="242" y="28" width="230" height="76" rx="8" fill="#faf5ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1"/><circle cx="262" cy="50" r="11" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="262" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">2</text><text x="280" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#7c3aed" text-anchor="start">Structure breaks the other way</text><text x="256" y="74.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">an opposite CHoCH / break appears.</text><text x="256" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">The idea is dead.</text><rect x="4" y="112" width="230" height="76" rx="8" fill="#faf5ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1"/><circle cx="24" cy="134" r="11" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="24" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">3</text><text x="42" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#7c3aed" text-anchor="start">Price reaches the TARGET first</text><text x="18" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">it ran without you.</text><text x="18" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">Never chase it.</text><rect x="242" y="112" width="230" height="76" rx="8" fill="#faf5ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1"/><circle cx="262" cy="134" r="11" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="262" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">4</text><text x="280" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#7c3aed" text-anchor="start">16:00 ET (New York close)</text><text x="256" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">cancel every unfilled order</text><text x="256" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="normal" fill="#1f2937" text-anchor="start">at the end of the NY session.</text></svg>