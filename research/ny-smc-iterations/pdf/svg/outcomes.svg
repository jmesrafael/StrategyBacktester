<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200"><rect width="480" height="200" fill="white"/><text x="0" y="14.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">WHAT 154 BACKTESTED TRADES LOOKED LIKE (SOL + ETH, 2023-26, $10 risk)</text><rect x="6" y="34" width="139.83116883116884" height="46" rx="4" fill="#16a34a" fill-opacity="1" stroke="none" stroke-width="1"/><text x="75.91558441558442" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">31%</text><text x="75.91558441558442" y="71.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="white" text-anchor="middle">47 trades</text><text x="75.91558441558442" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#16a34a" text-anchor="middle">Hit the 3R target</text><rect x="148.83116883116884" y="34" width="164.14285714285714" height="46" rx="4" fill="#9ca3af" fill-opacity="1" stroke="none" stroke-width="1"/><text x="230.9025974025974" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">36%</text><text x="230.9025974025974" y="71.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="white" text-anchor="middle">55 trades</text><text x="230.9025974025974" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#6b7280" text-anchor="middle">Stopped at breakeven (about $0)</text><rect x="315.97402597402595" y="34" width="155.02597402597402" height="46" rx="4" fill="#dc2626" fill-opacity="1" stroke="none" stroke-width="1"/><text x="393.487012987013" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">34%</text><text x="393.487012987013" y="71.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="white" text-anchor="middle">52 trades</text><text x="393.487012987013" y="96.0" font-family="Arial, Helvetica, sans-serif" font-size="9.6" font-weight="bold" fill="#dc2626" text-anchor="middle">Stopped out (-$10 or -$5)</text><rect x="6" y="112" width="468" height="78" rx="8" fill="#f9fafb" fill-opacity="1" stroke="#d1d5db" stroke-width="1"/><text x="18" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#1f2937" text-anchor="start">Roughly 1 trade in 3 reaches the target; the rest are small scratches or losses.</text><text x="18" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start">Average trade: about +$5.7 at $10 risk (about 4 trades a month across SOL + ETH).</text><text x="18" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="start">Longest stretch without a winner: 8 trades in a row. Biggest drawdown about -$57.</text><text x="18" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="normal" fill="#6b7280" text-anchor="start">These are backtest results on data the rules were tuned on - not a promise.</text></svg>