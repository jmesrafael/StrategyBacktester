<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200"><rect width="480" height="200" fill="white"/><text x="0" y="14.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">AFTER THE ORDER FILLS: only two stop moves are allowed</text><rect x="4" y="70" width="96" height="50" rx="8" fill="#dbeafe" fill-opacity="1" stroke="#2563eb" stroke-width="1"/><text x="52" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb" text-anchor="middle">ORDER FILLED</text><text x="52" y="106.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="middle">stop 1R away</text><line x1="100" y1="95" x2="126.0" y2="95.0" stroke="#9ca3af" stroke-width="1.6"/><polygon points="128,95 121.69687028353127,98.04475873877861 121.69687028353127,91.95524126122139" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><rect x="130" y="30" width="170" height="60" rx="8" fill="#fff7ed" fill-opacity="1" stroke="#f59e0b" stroke-width="1"/><text x="215" y="48.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#f59e0b" text-anchor="middle">A) price reaches +1R</text><text x="215" y="64.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">move the STOP to ENTRY</text><text x="215" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="middle">(worst case now = about zero)</text><rect x="130" y="104" width="170" height="70" rx="8" fill="#faf5ff" fill-opacity="1" stroke="#7c3aed" stroke-width="1"/><text x="215" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="bold" fill="#7c3aed" text-anchor="middle">B) after 4 candles</text><text x="215" y="137.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">price never got to +0.25R?</text><text x="215" y="152.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">pull the STOP in to -0.5R</text><text x="215" y="166.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="middle">(cut the weak trade early)</text><line x1="300" y1="60" x2="328.0675301207975" y2="52.51532530112066" stroke="#9ca3af" stroke-width="1.6"/><polygon points="330,52 324.69421644605944,56.56603338563505 323.1251752321586,50.682128833506816" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><line x1="300" y1="76" x2="328.53788946351426" y2="102.63536349927998" stroke="#9ca3af" stroke-width="1.6"/><polygon points="330,104 323.31456935894556,101.92514647657947 327.4695582697691,97.47337264355424" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><line x1="300" y1="139" x2="328.1222473682268" y2="149.31149070168314" stroke="#9ca3af" stroke-width="1.6"/><polygon points="330,150 323.03396844185613,150.68877015828505 325.1303131446367,144.971466423429" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><rect x="332" y="26" width="144" height="52" rx="8" fill="#dcfce7" fill-opacity="1" stroke="#16a34a" stroke-width="1"/><text x="404" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">TARGET  +3R</text><text x="404" y="62.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="middle">about +$30</text><rect x="332" y="88" width="144" height="40" rx="8" fill="#f3f4f6" fill-opacity="1" stroke="#9ca3af" stroke-width="1"/><text x="404" y="106.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">BREAKEVEN  about 0</text><text x="404" y="120.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="middle">stopped at entry</text><rect x="332" y="138" width="144" height="40" rx="8" fill="#fee2e2" fill-opacity="1" stroke="#dc2626" stroke-width="1"/><text x="404" y="155.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">STOP  -1R or -0.5R</text><text x="404" y="169.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#1f2937" text-anchor="middle">-$10 or -$5</text><text x="4" y="188.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="start">Never move a stop further away. Never take profit early.</text></svg>