<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200"><rect width="480" height="200" fill="white"/><text x="0" y="14.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">THE PLAN: 3 lines, drawn BEFORE you enter (a SHORT is shown; a long is the mirror)</text><rect x="8" y="68" width="142" height="84" rx="0" fill="#16a34a" fill-opacity="0.07" stroke="none" stroke-width="1"/><rect x="8" y="40" width="142" height="28" rx="0" fill="#dc2626" fill-opacity="0.12" stroke="none" stroke-width="1"/><rect x="8" y="56" width="52" height="24" rx="0" fill="#ef5350" fill-opacity="0.3" stroke="#ef5350" stroke-width="1"/><text x="34" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">gap (FVG)</text><line x1="8" y1="152" x2="150" y2="152" stroke="#16a34a" stroke-width="2.4"/><line x1="8" y1="68" x2="150" y2="68" stroke="#2563eb" stroke-width="2.4"/><line x1="8" y1="40" x2="150" y2="40" stroke="#dc2626" stroke-width="2.4"/><line x1="84" y1="68" x2="84" y2="152" stroke="#16a34a" stroke-width="1.8"/><text x="90" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="start">3R = +$30</text><line x1="84" y1="68" x2="84" y2="40" stroke="#dc2626" stroke-width="1.8"/><text x="90" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="start">1R = -$10</text><text x="160" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="start">TARGET</text><text x="160" y="169.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="start">= entry - 3 x risk</text><text x="160" y="72.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="start">ENTRY (limit order)</text><text x="160" y="85.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="start">= the middle of the gap</text><text x="160" y="44.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="start">STOP</text><text x="160" y="57.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" fill="#6b7280" text-anchor="start">just past the extreme</text><rect x="340" y="28" width="136" height="150" rx="8" fill="#fffbeb" fill-opacity="1" stroke="#f59e0b" stroke-width="1"/><text x="408" y="46.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#f59e0b" text-anchor="middle">SIZE THE TRADE</text><text x="348" y="64.0" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" fill="#1f2937" text-anchor="start">Position size =</text><text x="348" y="75.6" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="bold" fill="#1f2937" text-anchor="start">risk $ / stop distance</text><text x="348" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#6b7280" text-anchor="start">Example (ETH long):</text><text x="348" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#6b7280" text-anchor="start">entry 3,914.65</text><text x="348" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#6b7280" text-anchor="start">stop  3,870.07</text><text x="348" y="133.0" font-family="Arial, Helvetica, sans-serif" font-size="8.8" font-weight="normal" fill="#6b7280" text-anchor="start">distance 44.58 (1.14%)</text><text x="348" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#1f2937" text-anchor="start">$10 / 44.58 = 0.224 ETH</text><text x="348" y="167.2" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#1f2937" text-anchor="start">(about $878 position)</text></svg>