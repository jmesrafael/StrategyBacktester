<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>In-depth Analysis</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="stylesheet" href="css/analysis.css" />
</head>
<body>
<header class="band">
  <div class="wrap band-in">
    <div>
      <div class="tag">Past-price test · in-depth analysis</div>
      <h1 id="title">In-depth analysis</h1>
      <p class="sub" id="subtitle">The bots' own engines, run on Binance 4h candles for SOL, ZEC, ADA, NEAR and GALA. Costs included.</p>
    </div>
    <div class="band-actions">
      <a class="btn ghost" href="index.html">← Chart</a>
      <button class="btn ghost" id="refreshBtn" title="Download the newest candles">↻ Update data</button>
      <button class="btn ghost" id="printBtn">Print / PDF</button>
    </div>
  </div>
</header>

<!-- ===== settings ===== -->
<section class="controls" id="controls">
  <div class="wrap">
    <div class="ctl-row">
      <div class="ctl">
        <span class="ctl-l">Strategy</span>
        <div class="seg" id="stratSeg"></div>
      </div>
      <div class="ctl">
        <span class="ctl-l">Timeframe</span>
        <div class="seg" id="tfSeg"></div>
      </div>
      <div class="ctl">
        <span class="ctl-l">Coins</span>
        <div class="seg coins" id="coinSeg"></div>
      </div>
      <div class="ctl">
        <span class="ctl-l">Show</span>
        <div class="seg" id="viewSeg">
          <button data-v="total">Total summary</button>
          <button data-v="coin">By coin</button>
        </div>
      </div>
    </div>
    <div class="ctl-row">
      <div class="ctl-group" id="paramBox"></div>
      <label class="ctl chk"><input type="checkbox" id="costs" /> <span>Costs (fees · slippage · funding)</span></label>
    </div>
    <div class="ctl-row">
      <label class="ctl"><span class="ctl-l">Start balance</span>
        <span class="inp-cur"><select id="cur"><option>₱</option><option>$</option></select><input type="number" id="start" min="1" step="1000" /></span></label>
      <div class="ctl"><span class="ctl-l">Risk per trade</span>
        <span class="inp-row"><input type="number" id="risk" min="0.1" max="50" step="0.1" /><em>%</em><span class="seg mini" id="riskSeg"></span></span></div>
      <label class="ctl"><span class="ctl-l">Max risk per trade <i>(0 = no cap)</i></span><input type="number" id="cap" min="0" step="10" /></label>
      <label class="ctl"><span class="ctl-l">From</span><input type="date" id="from" /></label>
      <label class="ctl"><span class="ctl-l">To</span><input type="date" id="to" /></label>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</section>

<main class="wrap" id="main">
  <section class="card" id="secSummary"></section>
  <section class="card" id="secCoins"></section>
  <section class="card" id="secYears"></section>
  <section class="card" id="secMonths"></section>
  <section class="card" id="secCalendar"></section>
  <section class="card" id="secExp"></section>
  <section class="card" id="secGrowth"></section>
  <section class="card" id="secTrades"></section>
  <section class="card" id="secMethod"></section>
</main>
<div class="tip" id="tip" hidden></div>

<script src="js/bbcore-core.js"></script>
<script src="js/icore-core.js"></script>
<script src="js/analysis-core.js"></script>
<script src="js/analysis.js"></script>
</body>
</html>
