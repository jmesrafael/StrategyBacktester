<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Chart Replay — TradingView-style</title>
<!-- installable web app (PWA) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16181c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Replay Game" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">

  <!-- ===== TOP BAR ===== -->
  <div class="topbar">
    <div class="tb-left">
      <select id="symbol" class="sym-select" title="Symbol"></select>

      <!-- TF tabs + manage dropdown -->
      <div class="tf-picker" id="tfPicker">
        <div class="tf-tabs" id="tfTabs"></div>
        <button class="tf-manage-btn iconbtn" id="tfManageBtn" title="Manage timeframes"><i class="fas fa-chevron-down tf-caret"></i></button>
        <div class="tf-menu" id="tfMenu"></div>
      </div>

      <!-- chart type picker -->
      <div class="picker">
        <button class="iconbtn tb-icon" id="candleStyleBtn" title="Chart type">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="5" y="7" width="4" height="10" rx="1"/><path d="M7 4v3M7 17v3"/>
            <rect x="15" y="5" width="4" height="9" rx="1"/><path d="M17 2v3M17 14v3"/>
          </svg>
        </button>
        <div class="menu" id="candleStyleMenu">
          <button data-style="candlestick" class="menu-item active">Candlestick</button>
          <button data-style="heiken_ashi" class="menu-item">Heikin Ashi</button>
          <button data-style="line" class="menu-item">Line</button>
        </div>
      </div>

      <button class="tb-btn" id="indicatorsBtn">Indicators <span class="badge" id="indBadge"></span></button>
      <button class="tb-btn" id="strategyBtn">Strategy</button>
      <button class="tb-btn" id="replayBtn">Replay</button>
      <button class="tb-btn" id="dataBtn">Data</button>
    </div>

    <div class="tb-right">
      <span class="status" id="status"></span>
      <div class="field-inline">
        <label>Max candles</label>
        <select id="maxCandles"></select>
      </div>
      <button class="iconbtn tb-icon cloud-status" id="cloudStatus" title="Cloud save">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.6-1.4A4 4 0 0 1 17 18H7z"/></svg>
      </button>
      <button class="iconbtn tb-icon" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <!-- mobile only: overflow menu that collects the secondary top-bar controls -->
      <button class="iconbtn tb-icon m-only" id="moreBtn" title="More"><i class="fas fa-ellipsis-vertical"></i></button>
    </div>
    <div class="more-sheet" id="moreSheet"></div>
  </div>

  <!-- ===== STAGE: side dock + chart ===== -->
  <div class="stage">
    <!-- vertical drawing toolbar — a full-height column docked to the side -->
    <div class="side-toolbar" id="sideToolbar"></div>

    <div class="chart-host" id="chartHost">
      <div id="chart"></div>

      <!-- loading overlay (shown while candles are being fetched) -->
      <div class="chart-loader" id="chartLoader" hidden>
        <div class="cl-spinner"></div>
        <span class="cl-text" id="chartLoaderText">Loading…</span>
      </div>

      <!-- permanent refresh button, centered top of the chart (all modes) -->
      <button class="chart-refresh" id="refreshBtn" title="Refresh chart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-.5 4"/><path d="M20 4v7h-7"/></svg>
      </button>

      <!-- replay arming hint (scissors mode, before the cut point is chosen) -->
      <div class="cut-hint" id="cutHint"><i class="fas fa-scissors"></i> <span class="d-only">Double-click</span><span class="m-only">Tap</span> a candle to set the replay start point <button class="cut-random" id="randomStartBtn" title="Start from a random point"><i class="fas fa-dice"></i> Random</button></div>

      <!-- right-click context menu -->
      <div class="ctx-menu" id="ctxMenu"></div>

      <!-- floating drawing widget (mirrors the tools starred as favorites) -->
      <div class="float-toolbar" id="toolbar">
        <div class="ft-grip" id="ftGrip" title="Drag toolbar">
          <svg viewBox="0 0 8 16" fill="currentColor" width="8" height="16">
            <circle cx="2" cy="3"  r="1.2"/><circle cx="6" cy="3"  r="1.2"/>
            <circle cx="2" cy="8"  r="1.2"/><circle cx="6" cy="8"  r="1.2"/>
            <circle cx="2" cy="13" r="1.2"/><circle cx="6" cy="13" r="1.2"/>
          </svg>
        </div>
        <div class="ft-favs" id="ftFavs"></div>
        <div class="ft-sep"></div>
        <button class="iconbtn" id="clearBtn" title="Clear all drawings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
        <div class="ft-sep"></div>
        <button class="iconbtn ft-collapse-btn" id="toolbarCollapseBtn" title="Hide toolbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <!-- shown only when toolbar is collapsed -->
      <button class="ft-expand-btn" id="toolbarExpandBtn" title="Show toolbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- mobile only: the trade widget docks here (below / beside the chart) -->
    <aside class="m-dock" id="mDock"></aside>
  </div>

  <!-- ===== REPLAY TRANSPORT — shown via body.replay-mode ===== -->
  <div class="replaybar">
    <div class="rb-left">
      <button class="rb-exit-btn" id="exitReplayBtn" title="Exit replay"><i class="fas fa-xmark"></i> Exit</button>
      <div class="seg mode-seg" id="modeTabs" style="display:none">
        <button data-mode="game" class="active"><i class="fas fa-gamepad"></i> Game</button>
        <button data-mode="strategy"><i class="fas fa-bolt"></i> Strategy</button>
      </div>
    </div>

    <div class="rb-center">
      <div class="transport">
        <button class="iconbtn" id="rewindBtn" title="Rewind to start">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L11 12l9 6z"/></svg>
        </button>
        <button class="iconbtn primary" id="playBtn" title="Play / Pause (Space)">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="iconbtn" id="stepBtn" title="Step forward one candle (→)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l9 7-9 7zM16 5h2v14h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="rb-right">
      <div class="field-inline">
        <label>Speed</label>
        <select id="speed"></select>
      </div>
      <!-- Formation dropup -->
      <div class="fm-picker" id="fmPicker">
        <button class="fm-btn" id="fmBtn">Formation: <span id="fmLabel">Candle</span> <svg viewBox="0 0 10 6" width="8" height="5" fill="currentColor"><path d="M0 6L5 0l5 6z"/></svg></button>
        <div class="fm-menu" id="fmMenu">
          <button class="fm-opt fm-active" data-v="candle">Candle — one bar at a time</button>
          <button class="fm-opt" data-v="realistic">Realistic — animated tick by tick</button>
        </div>
      </div>
      <span class="pill" id="livePill">paused</span>
    </div>
  </div>

  <!-- ===== BOTTOM BAR: OHLCV under cursor ===== -->
  <div class="bottombar">
    <div class="ohlcv" id="ohlcv"></div>
    <div class="draw-info" id="drawInfo"></div>
  </div>

  <!-- ===== DATA PAGE ===== -->
  <section class="data-page" id="dataPage">
    <div class="data-page-header">
      <h2 class="data-page-title">Saved Backtests</h2>
      <button class="tb-btn" id="dataCompareBtn"><i class="fas fa-scale-balanced"></i> Compare</button>
      <button class="tb-btn" id="dataBackBtn"><i class="fas fa-arrow-left"></i> Chart</button>
    </div>
    <div class="data-compare-bar" id="dataCompareBar" style="display:none">
      <span class="dcmp-hint" id="dataCompareHint">Pick 2 saved runs to compare</span>
      <button class="tb-btn dcmp-go" id="dataCompareGo" disabled><i class="fas fa-scale-balanced"></i> Compare selected</button>
      <button class="tb-btn" id="dataCompareCancel">Cancel</button>
    </div>
    <div class="data-grid" id="dataGrid"></div>
  </section>
</div>

<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/mexc.js"></script>
<script src="js/candle-store.js"></script>
<script src="js/api.js"></script>
<script src="js/indicators.js"></script>
<script src="js/chart.js"></script>
<script src="js/indicators-ui.js"></script>
<script src="js/replay.js"></script>
<script src="js/drawings.js"></script>
<script src="js/draw-toolbar.js"></script>
<script src="js/fvg.js"></script>
<script src="js/strategy-overlay.js"></script>
<script src="js/smc.js"></script>
<script src="js/trade-sim.js"></script>
<script src="strategies/registry.js"></script>
<script src="strategies/orb-4h-reversal-strategy.js"></script>
<script src="strategies/ema-rsi-divergence-strategy.js"></script>
<script src="strategies/ny-smc-v7-strategy.js"></script>
<script src="strategies/htf-trend-atr-strategy.js"></script>
<script src="strategies/pivot-cross-strategy.js"></script>
<script src="strategies/pivot-cross-improved-strategy.js"></script>
<script src="strategies/pivot-cross-v2-strategy.js"></script>
<script src="strategies/pivot-rejection-strategy.js"></script>
<script src="strategies/pivot-cross-v4-strategy.js"></script>
<script src="strategies/macd-money-map-strategy.js"></script>
<script src="strategies/dema-tema-trend-strategy.js"></script>
<script src="strategies/fixed-mtf-golden-cross-strategy.js"></script>
<script src="js/stats-report.js"></script>
<script src="js/strategy.js"></script>
<script src="js/data-page.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
